<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물품 세액 정리 도우미</title>
<style>
/* ===== 모양(색·글씨) ===== */
body { font-family: "맑은 고딕", "Malgun Gothic", sans-serif; margin: 0; background: #f6f7f9; color: #222; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
</style>
</head>
<body>
<!-- ===== 화면 부분 ===== -->
<main>
  <h1>물품 세액 정리 도우미</h1>
  <p>화면은 기능 2에서 만들어요. 지금은 계산 규칙만 들어 있어요.</p>
</main>

<script>
// ===== 비과세 목록 =====
// 연습용 가상 목록 (연습자료/비과세목록.csv와 같음)
const 기본비과세목록 = [
  { 이름: "우유", 구분: "비과세" },
  { 이름: "생선", 구분: "비과세" },
  { 이름: "항공권", 구분: "비과세" },
  { 이름: "우편 발송 요금", 구분: "면세" },
];

// 물품 이름 안에 목록의 이름이 들어 있으면 같은 구분으로 봄 ('저지방 우유' → '우유')
function 구분찾기(물품이름, 목록) {
  const 이름 = String(물품이름 || "").replace(/\s+/g, "");
  for (const 항목 of 목록) {
    if (이름.includes(항목.이름.replace(/\s+/g, ""))) {
      return { 구분: 항목.구분, 맞은이름: 항목.이름 };
    }
  }
  return { 구분: "과세", 맞은이름: "" };
}

// ===== 계산 규칙 =====
const 카드C_기준금액 = 500000; // 연습용 가상 값

// 물품 하나를 받아 네 칸(공급가액·세액·불공제세·면세)을 정함
// 상태: "정상" / "확인 필요"(규칙이 아직 없음) / "오류"(넣은 값에 문제가 있음)
function 세액정하기(물품, 목록) {
  const 결과 = {
    구분: "", 공급가액: 0, 세액: 0, 불공제세: 0, 면세: 0,
    상태: "정상", 알림: [], 오류종류: "",
  };
  const 찾음 = 구분찾기(물품.물품이름, 목록);
  결과.구분 = 찾음.구분;
  if (찾음.맞은이름 && 찾음.맞은이름 !== String(물품.물품이름).trim()) {
    결과.알림.push(`'${찾음.맞은이름}'(으)로 보고 ${찾음.구분}로 판단했어요`);
  }

  // 총 금액 정하기
  let 총금액 = 물품.총금액;
  const 단가 = 물품.단가, 개수 = 물품.개수;
  if (총금액 == null && 단가 != null && 개수 != null) 총금액 = 단가 * 개수;
  if (총금액 == null) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push("금액이 빠졌어요");
    return 결과;
  }
  if (단가 != null && 개수 != null && 단가 * 개수 !== 총금액) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push(`금액 확인 필요: 1개 값 × 개수 = ${금액글(단가 * 개수)}원인데 총 금액은 ${금액글(총금액)}원이에요`);
    return 결과;
  }
  결과.총금액 = 총금액;

  // 카드 확인
  const 카드 = String(물품.카드 || "").trim().toUpperCase();
  if (!카드) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push("카드 종류가 빠졌어요");
    return 결과;
  }
  if (!["A", "B", "C"].includes(카드)) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push(`카드 종류 '${카드}'를 모르겠어요 (A·B·C 중 하나)`);
    return 결과;
  }

  // 아직 규칙이 없는 경우는 지어내지 않음
  if (결과.구분 === "면세") {
    결과.상태 = "확인 필요";
    결과.알림.push("면세 칸에 금액을 나누는 방법이 아직 정해지지 않았어요");
    return 결과;
  }
  if (결과.구분 === "비과세" && 카드 !== "A") {
    결과.상태 = "확인 필요";
    결과.알림.push(`비과세 물품을 카드 ${카드}로 결제한 경우의 규칙이 아직 없어요`);
    return 결과;
  }

  const 공급가액 = Math.round(총금액 / 1.1);
  const 나머지 = 총금액 - 공급가액;
  결과.공급가액 = 공급가액;

  if (결과.구분 === "비과세" || 카드 === "B") {
    결과.불공제세 = 나머지;               // 비과세 + A, 과세 + B
  } else {
    결과.세액 = 나머지;                   // 과세 + A 또는 C
    if (카드 === "C" && 총금액 > 카드C_기준금액) {
      결과.알림.push(`카드 C 기준 금액(${금액글(카드C_기준금액)}원)을 넘어 카드 A처럼 계산했어요`);
    }
  }
  return 결과;
}

function 금액글(n) { return Number(n).toLocaleString("ko-KR"); }
</script>
</body>
</html>
