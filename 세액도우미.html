<!doctype html>
<html lang="ko">
<head>

<title>물품 세액 정리 도우미</title>
<style>

body { font-family: "맑은 고딕", "Malgun Gothic", sans-serif; margin: 0; background: #f6f7f9; color: #222; }

h1 { font-size: 24px; margin: 8px 0 4px; }
.설명 { color: #555; font-size: 14px; margin: 4px 0; }
.상자 { background: #fff; border: 1px solid #dde1e6; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }

.카드고르기 label { margin-left: 10px; font-size: 16px; cursor: pointer; }
textarea { width: 100%; box-sizing: border-box; min-height: 160px; font-size: 16px; padding: 10px;
  border: 1px solid #c5ccd4; border-radius: 8px; font-family: inherit; }

.줄:last-child { border-bottom: none; }
.줄.체크됨 { background: #f3f8f3; }
.줄 input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; cursor: pointer; }
.줄내용 { flex: 1; }
.물품 { font-weight: bold; font-size: 16px; }
.작게 { color: #666; font-size: 13px; }
.표시 { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: bold; margin-left: 6px; }
.표시.과세 { background: #e3edff; color: #1d4fb8; }
.표시.불공제 { background: #ffeedd; color: #b3540a; }
.표시.면세 { background: #eceff2; color: #4a5560; }
.표시.확인필요 { background: #fff4c2; color: #7a5b00; }
.표시.오류 { background: #ffe0e0; color: #b00020; }
.계산 { margin-top: 4px; font-size: 15px; }
.알림 { margin-top: 4px; font-size: 13px; color: #7a5b00; }
.알림.오류 { color: #b00020; }
.매입 { margin-top: 4px; font-size: 14px; }
.매입 b { padding: 1px 8px; border-radius: 6px; margin-left: 4px; }
.매입 label { cursor: pointer; }
.줄 .매입 input[type=checkbox] { width: 17px; height: 17px; margin: 0 0 0 4px; vertical-align: -3px; }
.매입.가능 b { background: #dff3e4; color: #1b6b34; }
.매입.불가 b { background: #ffeedd; color: #b3540a; }
.매입.없음 b { background: #eceff2; color: #4a5560; }
.요약 { font-size: 15px; margin: 6px 0; }
table.합계 { border-collapse: collapse; margin-top: 8px; font-size: 15px; }
table.합계 th, table.합계 td { border: 1px solid #dde1e6; padding: 6px 12px; text-align: right; }
table.합계 th { background: #f0f3f6; }
.숨김 { display: none; }
.탭줄 { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; border-bottom: 2px solid #dde1e6; padding-bottom: 8px; }
.탭줄 button { margin: 0; padding: 6px 12px; font-size: 14px; }
.탭줄 button.고름 { background: #2f6fde; border-color: #2f6fde; color: #fff; font-weight: bold; }
.항목 { margin-top: 4px; font-size: 14px; }

</style>
</head>
<body>
<!-- ===== 문제 알림: 이 인터넷 창에서 도구가 작동하지 않으면 맨 위에 안내를 띄움 ===== -->
<div id="문제알림" style="display:none;background:#ffe0e0;color:#b00020;padding:12px 16px;font-weight:bold;"></div>
<script>
window.onerror = function (메시지) {
  var 칸 = document.getElementById("문제알림");
  칸.style.display = "block";
  칸.textContent = "도구에서 예상하지 못한 문제가 생겼어요. 키보드 F5를 눌러 새로 고친 뒤 다시 해 보세요. 계속 뜨면 크롬이나 엣지(최신판)로 열어 주세요. (오류: " + 메시지 + ")";
};
</script>
<!-- ===== 화면 부분 ===== -->
<main>
  <div class="맨위">
    <div>
      <h1>물품 세액 정리 도우미</h1>
      <p class="설명">연습용 도구예요. 넣은 자료는 이 노트북 밖으로 나가지 않아요.</p>
    </div>
    <div class="카드고르기" id="카드고르기">
      카드 종류:
      <label><input type="radio" name="카드" value="A" checked> A(자체)</label>
      <label><input type="radio" name="카드" value="B"> B(에특)</label>
      <label><input type="radio" name="카드" value="C"> C(하이브리드)</label>
    </div>
  </div>

  <div class="상자">
    <p class="설명">한 줄에 물품 하나씩 적거나 붙여 넣으세요. <b>물품 이름 · 1개 값 · 개수 · 총 금액 · 카드</b> 순서예요.</p>
    <p class="설명">금액만 적어도 돼요 (예: <code>우유 11000</code>). <code>33,000원</code>, <code>6개</code>처럼 적어도 읽어요. 줄 끝에 A(자체)·B(에특)·C(하이브리드) 중 영문자 하나를 적으면 그 줄은 그 카드로 계산해요.</p>
    <textarea id="입력칸" placeholder="(회색 글씨는 보기예요. 여기에 직접 적거나 [예시 넣기]를 누르세요)&#10;복사용지 5500 6 33000&#10;우유 1100 10 11000&#10;프린터용지 상자 27500 2 55000 B"></textarea>
    <button class="주요" id="확인버튼">과세 여부 확인</button>
    <button id="예시버튼">예시 넣기</button>
    <button id="지우기버튼">지우기</button>
    <button id="연습버튼">연습 자료 불러오기</button>
    <input type="file" id="연습파일" accept=".csv,text/csv" class="숨김">
    <p class="설명">연습 자료: <code>연습자료/구매목록.csv</code>를 고르면 물품마다 카드 종류를 파일에서 읽고, 정답과 맞는지 ✅❌로 보여 줘요.</p>
  </div>

  <div class="상자 숨김" id="결과상자">
    <div class="탭줄" id="탭자리"></div>
    <div class="요약" id="요약"></div>
    <div id="목록"></div>
    <div id="합계자리"></div>
  </div>
</main>

<script>
// ===== 세금 기준 (법령 기반, 기능 9) =====
// 근거: 부가가치세법 제26조 제1항(면세). 실제 적용 전 국가법령정보센터·국세청 자료로 확인할 것.
// 구분: "면세"(부가세 없음 → 공급가액 100%) / "과세·불공제"(부가세는 있지만 카드전표로 공제 안 됨) / "과세"
// 판단 순서: ① 과세 예외 → ② 과세·불공제 → ③ 면세 → ④ 없으면 과세
// 낱말이 두 글자 이상이면 이름 안에 들어 있을 때, 한 글자('배','무' 등)면 따로 떨어져 있을 때만 맞음
// 단, ① 과세 예외는 한 글자('즙','칩','빵' 등)도 이름 안에 들어 있으면 맞음 ('사과즙', '감자칩')
const 세금기준 = [
  // ① 과세 예외: 면세 낱말이 들어 있어도 과세
  { 단계: 1, 구분: "과세", 근거: "가공유·가공식품은 면세가 아님 (부가가치세법 제26조 제1항 제1호는 미가공 식료품만)",
    낱말: ["초코우유", "딸기우유", "바나나우유", "커피우유", "가공유", "우유맛", "요구르트", "요거트", "치즈", "버터", "아이스크림",
          "조미김", "김밥", "도시락", "과자", "스낵", "칩", "깡", "빵", "케이크", "음료", "주스", "즙", "잼", "소스", "케첩",
          "생수", "탄산수", "커피", "라면", "햄", "소시지", "통조림", "찌개"] },
  { 단계: 1, 구분: "과세", 근거: "장류는 포장 판매 등 경우에 따라 과세로 봄", 주의: "장류는 파는 방식에 따라 면세일 수도 있어요",
    낱말: ["고추장", "간장", "된장", "쌈장"] },
  { 단계: 1, 구분: "과세", 근거: "택배·소포는 우편 면세에서 빠짐", 낱말: ["택배", "소포"] },
  { 단계: 1, 구분: "과세", 근거: "일반 의약품·건강식품은 면세가 아님", 낱말: ["영양제", "건강식품", "비타민"] },
  { 단계: 1, 구분: "과세", 근거: "광고는 신문·잡지 면세에서 빠짐", 낱말: ["광고"] },
  // ② 과세·불공제: 여객운송 면세에서 빠지는 것. 카드전표로는 매입세액 공제가 안 되는 것으로 봄
  { 단계: 2, 구분: "과세·불공제", 근거: "여객운송 중 항공기·고속철도·택시·전세버스·관광유람선 등은 면세에서 빠짐 (부가가치세법 제26조 제1항 여객운송 단서)",
    주의: "카드전표로 매입세액 공제가 안 되는지 국세청 자료로 확인해 주세요",
    낱말: ["항공권", "항공료", "비행기", "KTX", "SRT", "고속철도", "택시", "전세버스", "관광유람선", "유람선"] },
  // ③ 면세
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 제1호 (미가공 식료품)",
    낱말: ["쌀", "콩", "팥", "무", "파", "배", "감", "귤", "굴", "게", "김",
          "현미", "찹쌀", "보리", "잡곡", "채소", "야채", "배추", "양파", "마늘", "대파", "감자", "고구마", "당근", "오이", "호박",
          "상추", "고추", "고춧가루", "버섯", "과일", "사과", "감귤", "딸기", "포도", "수박", "참외", "바나나", "토마토", "복숭아",
          "생선", "고등어", "갈치", "명태", "오징어", "새우", "조개", "수산물", "해산물", "미역", "다시마", "마른김",
          "소고기", "쇠고기", "돼지고기", "닭고기", "정육", "계란", "달걀", "우유", "두부"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 제1호 (미가공 식료품: 김치 등 단순 가공)", 주의: "포장 제품은 면세인지 확인해 주세요", 낱말: ["김치"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (수돗물)", 낱말: ["수돗물", "수도요금", "상수도"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (연탄·무연탄)", 낱말: ["연탄"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (여성용 생리 처리 위생용품)", 낱말: ["생리대", "탐폰"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (의료보건 용역)", 낱말: ["진료비", "진찰료", "병원비", "처방약", "조제약", "예방접종"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (교육 용역)", 주의: "인가·등록된 교육기관만 면세예요", 낱말: ["교육비", "수강료"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (여객운송 용역)", 주의: "관광유람선 등은 과세예요",
    낱말: ["시내버스", "마을버스", "버스비", "지하철", "전철", "여객선", "배요금", "뱃삯"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (도서·신문·잡지)", 낱말: ["책", "도서", "신문", "잡지", "전자책"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (우표·인지 / 국가가 공급하는 우편 용역)", 낱말: ["우표", "수입인지", "인지대", "증지", "우편", "등기"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (금융·보험 용역)", 낱말: ["보험료"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (도서관·박물관 등 입장)", 낱말: ["도서관", "박물관", "미술관"] },
];

// 이름이 낱말과 맞는지 봄
function 낱말맞음(이름, 낱말, 안에만있어도) {
  if (낱말.length >= 2 || 안에만있어도) return 이름.replace(/\s+/g, "").toUpperCase().indexOf(낱말.toUpperCase()) >= 0;
  return 이름.split(/[\s,()\[\]\/·+]+/).indexOf(낱말) >= 0;
}

// 이름으로 구분·근거를 찾음. 같은 단계에서는 더 긴 낱말을 먼저 씀 ('도서관'이 '도서'보다 먼저)
function 구분찾기(물품이름) {
  const 이름 = String(물품이름 || "").trim();
  for (const 단계 of [1, 2, 3]) {
    let 고른것 = null;
    세금기준.filter(묶음 => 묶음.단계 === 단계).forEach(묶음 => {
      묶음.낱말.forEach(낱말 => {
        if (낱말맞음(이름, 낱말, 단계 === 1) && (!고른것 || 낱말.length > 고른것.낱말.length)) {
          고른것 = { 구분: 묶음.구분, 근거: 묶음.근거, 주의: 묶음.주의 || "", 낱말 };
        }
      });
    });
    if (고른것) return 고른것;
  }
  return { 구분: "과세", 근거: "면세 기준에 없는 물품이라 과세로 봄", 주의: "", 낱말: "" };
}

// ===== 계산 규칙 =====
const 카드C_기준금액 = 500000; // 연습용 가상 값
const 금액상한 = 1000000000;    // 연습용 상한 10억 원. 넘으면 잘못 적은 것으로 보고 안내

// 물품 하나를 받아 세 칸(공급가액·세액·불공제세)을 정함
// 상태: "정상" / "오류"(넣은 값에 문제가 있음)
function 세액정하기(물품, 목록) {
  const 결과 = {
    구분: "", 공급가액: 0, 세액: 0, 불공제세: 0, 매입부가세: "–", 항목: "–",
    상태: "정상", 알림: [], 오류종류: "",
  };
  const 찾음 = 구분찾기(물품.물품이름);
  결과.구분 = 찾음.구분;
  결과.근거 = 찾음.근거 + (찾음.낱말 ? ` · 알아본 낱말: '${찾음.낱말}'` : "");
  if (찾음.주의) 결과.알림.push("⚠️ 확인 필요: " + 찾음.주의);

  // 물품 이름이 없으면 계산하지 않음
  if (!String(물품.물품이름 || "").trim()) {
    결과.상태 = "오류"; 결과.오류종류 = "이름";
    결과.알림.push("물품 이름이 빠졌어요. 이름을 먼저 적어 주세요 (예: 복사용지 33000)");
    return 결과;
  }

  // 넣은 숫자 살펴보기 (문제가 있으면 계산하지 않고 원인을 알려 줌)
  const 숫자문제 = 숫자살펴보기(물품);
  if (숫자문제) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push(숫자문제);
    return 결과;
  }

  // 총 금액 정하기
  let 총금액 = 물품.총금액;
  const 단가 = 물품.단가, 개수 = 물품.개수;
  if (총금액 == null && 단가 != null && 개수 != null) 총금액 = 단가 * 개수;
  if (총금액 == null) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push("금액이 빠졌어요");
    return 결과;
  }
  if (단가 != null && 개수 != null && 단가 * 개수 !== 총금액) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push(`금액 확인 필요: 1개 값 × 개수 = ${금액글(단가 * 개수)}원인데 총 금액은 ${금액글(총금액)}원이에요`);
    return 결과;
  }
  결과.총금액 = 총금액;

  // 카드 확인
  const 카드 = String(물품.카드 || "").trim().toUpperCase();
  if (!카드) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push("카드 종류가 빠졌어요");
    return 결과;
  }
  if (!["A", "B", "C"].includes(카드)) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push(`카드 종류 '${카드}'를 모르겠어요 (A·B·C 중 하나)`);
    return 결과;
  }

  // 면세: 카드와 상관없이 공급가액 100%
  if (결과.구분 === "면세") {
    결과.공급가액 = 총금액;
    결과.매입부가세 = 매입부가세정하기(결과);
    결과.항목 = 항목정하기(결과, 카드);
    return 결과;
  }

  const 공급가액 = Math.round(총금액 / 1.1);
  const 나머지 = 총금액 - 공급가액;
  결과.공급가액 = 공급가액;

  if (결과.구분 === "과세·불공제" || 카드 === "B") {
    결과.불공제세 = 나머지;               // 과세·불공제 + 모든 카드, 과세 + 에특카드(B: 정부보조금이라 환급 안 됨)
  } else {
    결과.세액 = 나머지;                   // 과세 + A 또는 C
    if (카드 === "C" && 총금액 > 카드C_기준금액) {
      결과.알림.push(`카드 C(하이브리드) 기준 금액(${금액글(카드C_기준금액)}원)을 넘어 카드 A(자체)처럼 계산했어요`);
    }
  }
  결과.매입부가세 = 매입부가세정하기(결과);
  결과.항목 = 항목정하기(결과, 카드);
  return 결과;
}

// 항목을 정함 (면세 → 면세, A → 매입부가세-카드, B → 매입부가세-불공제,
// C → 50만원 이하면 가지급금, 50만원 초과면 매입부가세-카드)
const 항목목록 = ["매입부가세-카드", "매입부가세-불공제", "가지급금", "면세"];
function 항목정하기(결과, 카드) {
  if (결과.구분 === "면세") return "면세";
  if (카드 === "A") return "매입부가세-카드";
  if (카드 === "B") return "매입부가세-불공제";
  if (카드 === "C") return 결과.총금액 > 카드C_기준금액 ? "매입부가세-카드" : "가지급금";
  return "–";
}

// 매입부가세 대상인지 정함
// 가. 과세 + 공제 가능(세액 칸) → 대상 (공제 가능)
// 나. 과세 + 불공제(불공제세 칸, 과세·불공제 물품과 에특카드 포함) → 대상 (공제 불가)
// 다. 면세 / 라. 부가세가 없는 거래(세액·불공제세 모두 0원) → 해당없음
function 매입부가세정하기(결과) {
  if (결과.구분 === "면세") return "해당없음";
  if (결과.세액 > 0) return "대상 (공제 가능)";
  if (결과.불공제세 > 0) return "대상 (공제 불가)";
  return "해당없음";
}

// 1개 값·개수·총 금액 칸을 살펴보고, 문제가 있으면 안내 문구를 돌려줌 (없으면 "")
function 숫자살펴보기(물품) {
  // [칸 이름, 값, 이름 뒤에 붙는 말(이/가)]
  const 칸들 = [["1개 값", 물품.단가, "이"], ["개수", 물품.개수, "가"], ["총 금액", 물품.총금액, "이"]];
  for (const [이름, 값, 조사] of 칸들) {
    if (값 == null) continue;
    if (isNaN(값)) return `${이름} 칸에 숫자가 아닌 글자가 있어요. 숫자만 적어 주세요 (예: 33000)`;
    if (값 < 0) return `${이름}${조사} 0보다 작아요 (마이너스). 맞게 적었는지 확인해 주세요`;
    if (값 % 1 !== 0) return `${이름}에 소수점이 있어요. ${이름 === "개수" ? "개수는" : "금액은"} 소수점 없이 적어 주세요`;
    if (값 === 0) return `${이름}${조사} 0이에요. 맞게 적었는지 확인해 주세요`;
    if (값 > 금액상한) return `${이름}${조사} 너무 커요 (${금액글(금액상한)}원 넘음). 0이 더 붙지 않았는지 확인해 주세요`;
  }
  return "";
}

function 금액글(n) { return Number(n).toLocaleString("ko-KR"); }

// 화면에 보이는 카드 이름 (계산은 A·B·C 영문자로 함)
const 카드이름표 = { A: "A(자체)", B: "B(에특)", C: "C(하이브리드)" };
function 카드이름(카드) { const k = String(카드).trim().toUpperCase(); return 카드이름표[k] || k; }

// ===== 읽기 부분 =====
// 한 줄을 물품 이름 · 1개 값 · 개수 · 총 금액 · 카드로 나눔
// 숫자 1개 → 총 금액 / 2개 → 1개 값, 개수 / 3개 → 1개 값, 개수, 총 금액
function 한줄읽기(줄, 기본카드) {
  const 조각 = 줄.replace(/\t/g, " ").trim().split(/\s+/);
  let 카드 = null;
  const 숫자 = [];
  while (조각.length > 0) {
    const 끝 = 조각[조각.length - 1];
    // 줄 끝의 영문자 하나는 카드로 봄 (A·B·C가 아니면 뒤에서 '모르는 카드'로 알려 줌)
    if (카드 === null && 숫자.length === 0 && /^[A-Za-z]$/.test(끝)) {
      카드 = 끝.toUpperCase(); 조각.pop(); continue;
    }
    // 숫자로 봄: 쉼표, 끝의 '원'·'개'를 빼고, 마이너스(-)·소수점도 일단 읽은 뒤 뒤에서 알려 줌
    const 숫자글 = 끝.replace(/,/g, "").replace(/(원|개)$/, ""); // '33,000원', '6개'도 숫자로 읽음
    if (/^-?\d+(\.\d+)?$/.test(숫자글)) { 숫자.unshift({ 값: Number(숫자글), 개: /개$/.test(끝) }); 조각.pop(); continue; }
    break;
  }
  const 쓸숫자 = 숫자.slice(-3);
  const 물품 = { 물품이름: 조각.join(" "), 단가: null, 개수: null, 총금액: null, 카드: 카드 || 기본카드 };
  const 개붙은것 = 쓸숫자.filter(n => n.개);
  if (개붙은것.length === 1 && 쓸숫자.length >= 2) {
    // '6개'처럼 '개'가 붙은 숫자는 개수로, 나머지는 순서대로 1개 값·총 금액 (하나뿐이면 총 금액)
    const 나머지 = 쓸숫자.filter(n => !n.개).map(n => n.값);
    물품.개수 = 개붙은것[0].값;
    if (나머지.length === 1) 물품.총금액 = 나머지[0];
    else { 물품.단가 = 나머지[0]; 물품.총금액 = 나머지[1]; }
    return 물품;
  }
  const 값들 = 쓸숫자.map(n => n.값);
  if (값들.length === 1) 물품.총금액 = 값들[0];
  if (값들.length === 2) { 물품.단가 = 값들[0]; 물품.개수 = 값들[1]; }
  if (값들.length === 3) { 물품.단가 = 값들[0]; 물품.개수 = 값들[1]; 물품.총금액 = 값들[2]; }
  return 물품;
}

function 목록읽기(글, 기본카드) {
  return 글.split(/\r?\n/).map(줄 => 줄.trim()).filter(줄 => 줄).map(줄 => 한줄읽기(줄, 기본카드));
}

// ===== 화면 부분: 체크리스트 그리기 =====
let 지금줄들 = []; // [{물품, 결과, 정답비교}]
let 지금탭 = "전체";

// ===== 화면 부분: 항목별 탭 =====
function 탭맞음(줄) { return 지금탭 === "전체" || 줄.결과.항목 === 지금탭; }

function 탭그리기() {
  const 자리 = document.getElementById("탭자리");
  자리.innerHTML = "";
  ["전체"].concat(항목목록).forEach(탭 => {
    const 수 = 탭 === "전체" ? 지금줄들.length : 지금줄들.filter(줄 => 줄.결과.항목 === 탭).length;
    const 단추 = 요소("button", 탭 === 지금탭 ? "고름" : "", `${탭} (${수})`);
    단추.addEventListener("click", () => { 지금탭 = 탭; 탭적용(); });
    자리.appendChild(단추);
  });
}

function 탭적용() {
  지금줄들.forEach(줄 => 줄.칸.classList.toggle("숨김", !탭맞음(줄)));
  탭그리기();
  요약그리기();
}

function 고른카드() {
  return document.querySelector('input[name="카드"]:checked').value;
}

function 요소(태그, 반, 글) {
  const e = document.createElement(태그);
  if (반) e.className = 반;
  if (글 != null) e.textContent = 글;
  return e;
}

function 표시요소(결과) {
  if (결과.상태 === "오류") return 요소("span", "표시 오류", "❗ 넣은 값 확인");
  if (결과.상태 === "확인 필요") return 요소("span", "표시 확인필요", "⚠️ 확인 필요");
  return null;
}

function 구분요소(구분) {
  const 그림 = { 과세: "🟦 과세", "과세·불공제": "🟧 과세·불공제(여객운송)", 면세: "⬜ 면세" }[구분];
  const 반 = { 과세: "과세", "과세·불공제": "불공제", 면세: "면세" }[구분];
  return 요소("span", "표시 " + 반, 그림);
}

function 계산글(결과) {
  if (결과.상태 !== "정상") return "";
  const 칸 = [`공급가액 ${금액글(결과.공급가액)}`];
  if (결과.세액) 칸.push(`세액 ${금액글(결과.세액)}`);
  if (결과.불공제세) 칸.push(`불공제세 ${금액글(결과.불공제세)}`);
  if (결과.구분 === "면세") 칸.push("면세라 공급가액 100%");
  return "→ " + 칸.join(" / ");
}

function 체크리스트그리기() {
  const 목록 = document.getElementById("목록");
  목록.innerHTML = "";
  지금줄들.forEach((줄, i) => {
    const 칸 = 요소("div", "줄");
    줄.칸 = 칸;
    const 체크 = document.createElement("input");
    줄.확인 = 체크;
    체크.type = "checkbox";
    체크.className = "확인체크";
    체크.title = "이 물품을 확인했으면 체크";
    체크.addEventListener("change", () => { 칸.classList.toggle("체크됨", 체크.checked); 요약그리기(); });
    칸.appendChild(체크);

    const 내용 = 요소("div", "줄내용");
    const 첫줄 = 요소("div");
    첫줄.appendChild(요소("span", "물품", `${i + 1}. ${줄.물품.물품이름 || "(이름 없음)"}`));
    첫줄.appendChild(구분요소(줄.결과.구분));
    const 상태 = 표시요소(줄.결과);
    if (상태) 첫줄.appendChild(상태);
    if (줄.정답비교) 첫줄.appendChild(요소("span", "표시 " + (줄.정답비교.맞음 ? "과세" : "오류"), 줄.정답비교.맞음 ? "✅ 정답과 맞음" : "❌ 정답과 다름"));
    내용.appendChild(첫줄);

    const 금액부분 = [];
    const 보일숫자 = n => n != null && !isNaN(n);
    if (보일숫자(줄.물품.단가) && 보일숫자(줄.물품.개수)) 금액부분.push(`1개 ${금액글(줄.물품.단가)}원 × ${줄.물품.개수}개`);
    else if (보일숫자(줄.물품.개수)) 금액부분.push(`${줄.물품.개수}개`);
    const 총 = 줄.결과.총금액 != null ? 줄.결과.총금액 : 줄.물품.총금액;
    if (보일숫자(총)) 금액부분.push(`총 ${금액글(총)}원`);
    금액부분.push(`카드 ${줄.물품.카드 ? 카드이름(줄.물품.카드) : "(없음)"}`);
    if (줄.물품.날짜) 금액부분.push(줄.물품.날짜);
    내용.appendChild(요소("div", "작게", 금액부분.join(" · ")));

    if (줄.결과.근거) 내용.appendChild(요소("div", "작게", "근거: " + 줄.결과.근거));
    const 계산 = 계산글(줄.결과);
    if (계산) 내용.appendChild(요소("div", "계산", 계산));
    if (줄.결과.상태 === "정상") {
      const 항목칸 = 요소("div", "항목", "항목: ");
      항목칸.appendChild(요소("b", null, 줄.결과.항목));
      내용.appendChild(항목칸);
      내용.appendChild(매입부가세요소(줄));
    }
    줄.결과.알림.forEach(글 => 내용.appendChild(요소("div", "알림" + (줄.결과.상태 === "오류" ? " 오류" : ""), "· " + 글)));
    if (줄.정답비교 && !줄.정답비교.맞음) 내용.appendChild(요소("div", "알림 오류", "· 정답: " + 줄.정답비교.정답글));
    칸.appendChild(내용);
    목록.appendChild(칸);
  });
  document.getElementById("결과상자").classList.remove("숨김");
  지금탭 = "전체";
  탭적용();
}

// ===== 매입부가세 직접 체크·해제 =====
// 줄.매입직접: 없음(자동 그대로) / true(직접 체크) / false(직접 해제)
// 체크를 바꿔도 공급가액·세액·불공제세 숫자는 바뀌지 않음
function 매입값(줄) {
  const 자동 = 줄.결과.매입부가세;
  if (줄.매입직접 == null) return 자동;
  if (줄.매입직접 === false) return "해당없음";
  return 자동.indexOf("대상") === 0 ? 자동 : "대상 (직접 체크)";
}

function 매입부가세요소(줄) {
  const 값 = 매입값(줄);
  const 반 = 값 === "대상 (공제 가능)" ? "가능" : 값 === "해당없음" ? "없음" : "불가";
  const 칸 = 요소("div", "매입 " + 반);
  const 이름표 = document.createElement("label");
  이름표.appendChild(document.createTextNode("매입부가세: "));
  const 체크 = document.createElement("input");
  체크.type = "checkbox";
  체크.className = "매입체크";
  체크.title = "눌러서 직접 체크하거나 해제할 수 있어요";
  체크.checked = 값 !== "해당없음";
  체크.addEventListener("change", () => {
    const 자동대상 = 줄.결과.매입부가세.indexOf("대상") === 0;
    줄.매입직접 = 체크.checked === 자동대상 ? null : 체크.checked; // 자동과 같아지면 '직접 바꿈' 표시를 없앰
    칸.replaceWith(매입부가세요소(줄));
    요약그리기();
  });
  이름표.appendChild(체크);
  이름표.appendChild(요소("b", null, 값));
  칸.appendChild(이름표);
  if (줄.매입직접 != null) 칸.appendChild(요소("span", "작게", ` (직접 바꿈 · 자동 결과: ${줄.결과.매입부가세})`));
  return 칸;
}

function 요약그리기() {
  const 보이는줄 = 지금줄들.filter(탭맞음);
  const 체크수 = 보이는줄.filter(줄 => 줄.확인 && 줄.확인.checked).length;
  const 문제수 = 보이는줄.filter(줄 => 줄.결과.상태 !== "정상").length;
  let 글 = (지금탭 === "전체" ? "" : `[${지금탭}] `) + `물품 ${보이는줄.length}개 · 확인 ${체크수}/${보이는줄.length}`;
  if (문제수) 글 += ` · ⚠️❗ 살펴볼 물품 ${문제수}개`;
  const 비교 = 보이는줄.filter(줄 => 줄.정답비교);
  if (비교.length) 글 += ` · 정답과 맞음 ${비교.filter(줄 => 줄.정답비교.맞음).length}/${비교.length}`;
  document.getElementById("요약").textContent = 글;

  const 자리 = document.getElementById("합계자리");
  자리.innerHTML = "";
  if (!보이는줄.length) { if (지금줄들.length) 자리.appendChild(요소("p", "설명", "이 항목에 해당하는 물품이 없어요.")); return; }
  if (체크수 < 보이는줄.length) {
    자리.appendChild(요소("p", "설명", "모든 물품에 ☑ 체크하면 합계가 나와요."));
    return;
  }
  const 정상 = 보이는줄.filter(줄 => 줄.결과.상태 === "정상");
  const 합 = k => 정상.reduce((s, 줄) => s + 줄.결과[k], 0);
  const 표 = 요소("table", "합계");
  const 머리 = 요소("tr");
  ["", "공급가액", "세액", "불공제세", "총 금액"].forEach(t => 머리.appendChild(요소("th", null, t)));
  const 몸 = 요소("tr");
  [`합계 (${정상.length}개)`, 합("공급가액"), 합("세액"), 합("불공제세"), 합("총금액")]
    .forEach((v, i) => 몸.appendChild(요소(i ? "td" : "th", null, i ? 금액글(v) : v)));
  표.append(머리, 몸);
  자리.appendChild(요소("p", "요약", 지금탭 === "전체" ? "✅ 모두 확인했어요. 합계:" : `✅ [${지금탭}] 모두 확인했어요. 이 항목의 합계:`));
  자리.appendChild(표);
  const 건수 = 값 => 정상.filter(줄 => 매입값(줄) === 값).length;
  let 매입글 = `매입부가세: ☑ 대상 (공제 가능) ${건수("대상 (공제 가능)")}개 · ☑ 대상 (공제 불가) ${건수("대상 (공제 불가)")}개`;
  if (건수("대상 (직접 체크)")) 매입글 += ` · ☑ 대상 (직접 체크) ${건수("대상 (직접 체크)")}개`;
  매입글 += ` · ☐ 해당없음 ${건수("해당없음")}개`;
  const 직접수 = 정상.filter(줄 => 줄.매입직접 != null).length;
  if (직접수) 매입글 += ` (직접 바꾼 것 ${직접수}개)`;
  자리.appendChild(요소("p", "요약", 매입글));
  if (문제수) 자리.appendChild(요소("p", "알림", `· ⚠️❗ 표시된 ${문제수}개는 합계에 넣지 않았어요. 따로 확인해 주세요.`));
}

function 붙여넣은목록확인() {
  const 물품들 = 목록읽기(document.getElementById("입력칸").value, 고른카드());
  if (!물품들.length) {
    지금줄들 = [];
    document.getElementById("목록").innerHTML = "";
    document.getElementById("합계자리").innerHTML = "";
    document.getElementById("탭자리").innerHTML = "";
    document.getElementById("요약").textContent =
      "⚠️ 칸에 적힌 물품이 없어요. 칸 안의 회색 글씨는 보기예요. 물품을 직접 적거나 [예시 넣기]를 먼저 눌러 주세요.";
    document.getElementById("결과상자").classList.remove("숨김");
    return;
  }
  지금줄들 = 물품들.map(물품 => ({ 물품, 결과: 세액정하기(물품) }));
  체크리스트그리기();
}

// ===== 연습 자료 불러오기·정답 비교 =====
// 쉼표로 나눈 표 파일(CSV)을 읽음. 칸 이름은 연습자료/구매목록.csv와 같음
function CSV읽기(글) {
  const 줄들 = String(글 || "").replace(/^﻿/, "").split(/\r?\n/).filter(줄 => 줄.trim());
  if (!줄들.length) return null; // 빈 파일
  const 머리 = 줄들[0].split(",").map(t => t.trim());
  const 행들 = 줄들.slice(1).map(줄 => {
    const 칸 = 줄.split(",");
    const 행 = {};
    머리.forEach((이름, i) => { 행[이름] = (칸[i] || "").trim(); });
    return 행;
  });
  행들.머리 = 머리;
  return 행들;
}

// 구매목록 모양의 파일인지 살펴봄. 빠진 칸 이름을 돌려줌 (없으면 빈 목록)
function 빠진칸찾기(머리) {
  const 빠짐 = ["물품이름", "카드종류"].filter(k => 머리.indexOf(k) < 0);
  const 금액있음 = 머리.indexOf("총금액") >= 0 || (머리.indexOf("1개값") >= 0 && 머리.indexOf("구매개수") >= 0);
  if (!금액있음) 빠짐.push("총금액 (또는 1개값·구매개수)");
  return 빠짐;
}

function 숫자로(글) {
  const t = String(글 || "").replace(/,/g, "").trim();
  return t === "" ? null : Number(t);
}

function 정답비교하기(행, 결과) {
  const 정답 = 행["정답_공급가액"];
  if (정답 == null || 정답 === "") return null; // 정답 칸이 없는 파일이면 비교하지 않음
  if (/^\d+$/.test(정답)) {
    const 칸들 = ["공급가액", "세액", "불공제세"];
    const 매입정답 = 행["정답_매입부가세"];
    const 같게 = t => String(t || "").replace(/\s+/g, "");
    const 맞음 = 결과.상태 === "정상" && 칸들.every(k => 결과[k] === Number(행["정답_" + k] || 0))
      && (!매입정답 || 같게(매입정답) === 같게(결과.매입부가세))
      && (!행["정답_항목"] || 같게(행["정답_항목"]) === 같게(결과.항목));
    let 정답글 = 칸들.map(k => `${k} ${금액글(Number(행["정답_" + k] || 0))}`).join(" / ");
    if (매입정답) 정답글 += ` / 매입부가세 ${매입정답}`;
    if (행["정답_항목"]) 정답글 += ` / 항목 ${행["정답_항목"]}`;
    return { 맞음, 정답글 };
  }
  let 맞음;
  if (정답.includes("금액")) 맞음 = 결과.오류종류 === "금액";
  else if (정답.includes("카드")) 맞음 = 결과.오류종류 === "카드";
  else 맞음 = 결과.상태 === "확인 필요";
  return { 맞음, 정답글: 정답 };
}

// 결과 칸을 비우고 안내 문구만 보여 줌 (파일에 문제가 있을 때)
function 안내만보여주기(글) {
  지금줄들 = [];
  document.getElementById("목록").innerHTML = "";
  document.getElementById("합계자리").innerHTML = "";
  document.getElementById("탭자리").innerHTML = "";
  document.getElementById("요약").textContent = "⚠️ " + 글;
  document.getElementById("결과상자").classList.remove("숨김");
}

function 연습자료보여주기(글) {
  const 행들 = CSV읽기(글);
  if (행들 === null) { 안내만보여주기("고른 파일이 비어 있어요. 연습자료/구매목록.csv처럼 물품이 적힌 파일을 골라 주세요."); return; }
  const 빠짐 = 빠진칸찾기(행들.머리);
  if (빠짐.length) {
    안내만보여주기(`구매목록 모양의 파일이 아니에요. 첫 줄에 이 칸이 없어요: ${빠짐.join(", ")}. 연습자료/구매목록.csv를 골랐는지 확인해 주세요.`);
    return;
  }
  if (!행들.length) { 안내만보여주기("파일에 물품이 하나도 없어요 (첫 줄의 칸 이름만 있어요). 둘째 줄부터 물품을 적어 주세요."); return; }
  지금줄들 = 행들.map(행 => {
    const 물품 = {
      물품이름: 행["물품이름"], 단가: 숫자로(행["1개값"]), 개수: 숫자로(행["구매개수"]),
      총금액: 숫자로(행["총금액"]), 카드: 행["카드종류"], 날짜: 행["구입날짜"],
    };
    const 결과 = 세액정하기(물품);
    return { 물품, 결과, 정답비교: 정답비교하기(행, 결과) };
  });
  체크리스트그리기();
}

document.getElementById("연습버튼").addEventListener("click", () => document.getElementById("연습파일").click());
document.getElementById("연습파일").addEventListener("change", 이벤트 => {
  const 파일 = 이벤트.target.files[0];
  if (!파일) return;
  const 읽개 = new FileReader();
  읽개.onload = () => {
    try { 연습자료보여주기(읽개.result); }
    catch (e) { 안내만보여주기("파일을 읽다가 문제가 생겼어요. 연습자료/구매목록.csv와 같은 모양의 파일인지 확인해 주세요."); }
  };
  읽개.readAsText(파일, "utf-8");
  이벤트.target.value = "";
});

document.getElementById("확인버튼").addEventListener("click", 붙여넣은목록확인);
document.getElementById("예시버튼").addEventListener("click", () => {
  document.getElementById("입력칸").value =
    "복사용지 5500 6 33000\n우유 1100 10 11000 B\n초코우유 1650 4 6600\n항공권 165000 2 330000 C\n프린터용지 상자 27500 2 55000 B\n사무용 의자 132000 5 660000 C\n스테이플러 6600 2 15400";
});
document.getElementById("지우기버튼").addEventListener("click", () => {
  document.getElementById("입력칸").value = "";
  지금줄들 = [];
  document.getElementById("결과상자").classList.add("숨김");
});
</script>
